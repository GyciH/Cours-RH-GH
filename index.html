<!doctype html>
<html lang="fr"><head><meta charset="utf-8">

</head><body>
<title>Cours Rhino · Grasshopper</title>
<style>
:root{
  --ground:#F6F4F0; --card:#FFFFFF; --line:#E2DED7; --line2:#D5D0C8; --ink:#1E2226; --muted:#5E656B; --track:#ECE9E3;
  --ok:#2E7D32; --okp:#EEF6EE; --ko:#C62828; --kop:#FBEDED; --warn:#B45309; --warnp:#FBF1E6;
  --inv:#1E2226; --invfg:#FFFFFF; --mix:#1E2226;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#141619; --card:#1D2024; --line:#2D3135; --line2:#3A3F44; --ink:#ECE9E3; --muted:#9BA1A6; --track:#2A2E32;
  --ok:#6FBF73; --okp:#1C2A1D; --ko:#EF7A7A; --kop:#2E1C1C; --warn:#E8A15C; --warnp:#2E2316;
  --inv:#ECE9E3; --invfg:#141619; --mix:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#141619; --card:#1D2024; --line:#2D3135; --line2:#3A3F44; --ink:#ECE9E3; --muted:#9BA1A6; --track:#2A2E32;
  --ok:#6FBF73; --okp:#1C2A1D; --ko:#EF7A7A; --kop:#2E1C1C; --warn:#E8A15C; --warnp:#2E2316;
  --inv:#ECE9E3; --invfg:#141619; --mix:#FFFFFF; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ground);z-index:10}
button{font:inherit;color:inherit}
a{color:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
/* la couleur de partie, lisible dans les deux thèmes */
.pc{--pt:var(--pc)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pc{--pt:color-mix(in oklab,var(--pc) 55%,var(--mix))}}
:root[data-theme="dark"] .pc{--pt:color-mix(in oklab,var(--pc) 55%,var(--mix))}

#app{max-width:680px;margin:0 auto;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.ecran{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 12px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:26px;line-height:1.15;font-weight:700;text-wrap:balance}
h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sous{color:var(--muted);font-size:14px;margin:4px 0 0}
.carte{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ligne{display:flex;align-items:center;gap:10px;min-width:0}
.ecarte{justify-content:space-between}
.btn{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:var(--card);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn.plein{background:var(--inv);color:var(--invfg);border-color:var(--inv)}
.btn:disabled{opacity:.45;cursor:default}
.btn.petit{height:36px;padding:0 12px;font-size:13px}
.barre{height:8px;background:var(--track);border-radius:4px;overflow:hidden;flex:1;min-width:40px}
.barre>i{display:block;height:100%;background:var(--pt,var(--ink));border-radius:4px}
.puce{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--line2);font-size:12.5px;color:var(--muted);white-space:nowrap}
.puce b{color:var(--ink);font-weight:600;margin-left:4px}
button.puce{background:var(--card);cursor:pointer}
.puces{display:flex;flex-wrap:wrap;gap:6px}
.vide{color:var(--muted);font-size:14px;text-align:center;padding:24px 8px}

/* barre d'onglets */
nav.onglets{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.onglets div{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.onglets a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:500;color:var(--muted);text-decoration:none;position:relative}
nav.onglets a svg{width:22px;height:22px}
nav.onglets a[aria-current]{color:var(--ink);font-weight:700}
nav.onglets .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* listes de cours */
.cours-ligne{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);text-decoration:none;min-width:0}
.cours-ligne:first-child{border-top:none}
.cours-ligne .num{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:500;color:var(--pt)}
.cours-ligne .t{font-weight:600;font-size:15px;line-height:1.25}
.cours-ligne .m{font-size:12.5px;color:var(--muted)}
.etat{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;color:var(--muted)}
.etat::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor}
.etat.encours{color:var(--warn)} .etat.encours::before{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.etat.fini{color:var(--ok)} .etat.fini::before{background:currentColor}
.etat.revoir{color:var(--ko)} .etat.revoir::before{background:currentColor;border-radius:2px}
.groupe{display:flex;flex-direction:column;gap:2px}
.groupe-tete{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:2px 0 6px;border-bottom:2px solid var(--pt,var(--ink))}
.groupe-tete span{font-weight:700;font-size:16px}
.groupe-tete small{color:var(--muted);font-size:12.5px;white-space:nowrap}
.sousgroupe{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--pt);padding:12px 0 2px}

/* bibliothèque */
.recherche{display:flex;align-items:center;gap:8px;height:46px;padding:0 12px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.recherche input{flex:1;min-width:0;border:none;outline:none;background:transparent;font:inherit;font-size:16px;color:var(--ink)}
.segment{display:grid;grid-template-columns:repeat(3,1fr);background:var(--track);border-radius:12px;padding:3px;gap:3px}
.segment button{height:36px;border:none;border-radius:9px;background:transparent;font-size:13.5px;font-weight:500;cursor:pointer;color:var(--muted)}
.segment button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--line)}
.filtres{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.filtres button{flex:none;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line2);background:var(--card);font-size:13px;cursor:pointer}
.filtres button[aria-pressed="true"]{background:var(--inv);color:var(--invfg);border-color:var(--inv);font-weight:600}

/* accueil */
.parties{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.partie-tuile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;text-decoration:none;border-top:5px solid var(--pc);min-width:0}
.partie-tuile .no{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--pt)}
.partie-tuile .nm{font-weight:600;font-size:14px;line-height:1.25}
.partie-tuile .ct{font-size:12px;color:var(--muted)}
.grand{font-size:34px;font-weight:700;line-height:1}

/* page cours */
.bandeau{background:var(--pc);color:#fff;padding:20px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.bandeau .haut{display:flex;justify-content:space-between;align-items:center;font-size:13px;opacity:.92}
.bandeau .haut a{color:#fff;text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:4px;min-height:32px}
.bandeau h1{color:#fff;font-size:27px}
.bandeau p{margin:0;font-size:15px;line-height:1.45;opacity:.95}
.idee{font-size:16px;line-height:1.45;font-weight:500;margin:0}
ol.obj{margin:0;padding:0;list-style:none;counter-reset:o;display:flex;flex-direction:column;gap:8px}
ol.obj li{counter-increment:o;display:grid;grid-template-columns:24px 1fr;gap:8px}
ol.obj li::before{content:counter(o);width:22px;height:22px;border-radius:50%;background:var(--pc);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.retenir{border-left:4px solid var(--pc);background:color-mix(in oklab,var(--pc) 10%,var(--card));padding:12px 14px;border-radius:0 12px 12px 0}
.retenir b{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--pt);margin-bottom:4px}
.pages a{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:11px 0;border-top:1px solid var(--line);text-decoration:none}
.pages a:first-child{border-top:none}
.pages .pn{font-family:"JetBrains Mono",monospace;color:var(--muted);font-size:13px}
.pages .lu{font-size:12px;color:var(--ok);font-weight:600}
dl.glo{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin:0}
dl.glo dt{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--pt);font-weight:500}
dl.glo dd{margin:0 0 4px;font-size:14px}
details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details summary::after{content:"+";color:var(--muted);font-weight:400}
details[open] summary::after{content:"–"}

/* lecteur */
.lecteur-barre{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px}
.lecteur-barre .titre{flex:1;min-width:0;font-size:13px;line-height:1.25}
.lecteur-barre .titre b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.lecteur-barre .titre span{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feuille{overflow:auto;padding:12px max(8px,env(safe-area-inset-right,0px)) 12px max(8px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
.feuille-hote{margin:0 auto;box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line);background:#fff}
.lecteur-pied{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:8px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.points{display:flex;gap:6px;justify-content:center}
.points i{width:8px;height:8px;border-radius:50%;background:var(--track)}
.points i.on{background:var(--pt);transform:scale(1.25)}
.points i.lu{background:color-mix(in oklab,var(--pt) 45%,var(--track))}

/* QCM */
.q-tete{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.q-enonce{font-size:18px;font-weight:600;line-height:1.35;margin:0}
.q-tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--warn);text-transform:uppercase}
.options{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;padding:12px;border-radius:12px;border:1.5px solid var(--line2);background:var(--card);cursor:pointer;font-size:15px;line-height:1.35;min-height:48px}
.opt .l{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--muted)}
.opt.multi .l{border-radius:6px}
.opt.choisi{border-color:var(--ink)}
.opt.choisi .l{background:var(--inv);color:var(--invfg);border-color:var(--inv)}
.opt.juste{border-color:var(--ok);background:var(--okp)}
.opt.juste .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.faux{border-color:var(--ko);background:var(--kop)}
.opt.faux .l{background:var(--ko);border-color:var(--ko);color:#fff}
.opt .verdict{grid-column:2;font-size:12px;font-weight:700}
.opt.juste .verdict{color:var(--ok)} .opt.faux .verdict{color:var(--ko)}
.retour{border-radius:12px;padding:12px 14px;font-size:14.5px}
.retour.bon{background:var(--okp);border:1px solid var(--ok)}
.retour.mauvais{background:var(--kop);border:1px solid var(--ko)}
.retour b{display:block;margin-bottom:2px}
.progression-q{height:4px;background:var(--track);border-radius:2px;overflow:hidden}
.progression-q i{display:block;height:100%;background:var(--pt,var(--ink))}
.score{font-size:56px;font-weight:700;line-height:1}
.score small{font-size:22px;color:var(--muted);font-weight:500}
.recap-q{display:flex;flex-wrap:wrap;gap:6px}
.recap-q span{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:"JetBrains Mono",monospace}
.recap-q .o{background:var(--okp);color:var(--ok);border:1px solid var(--ok)}
.recap-q .x{background:var(--kop);color:var(--ko);border:1px solid var(--ko)}

/* progrès */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:26px;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--muted)}
.jours{display:grid;grid-template-columns:repeat(7,minmax(0,30px));gap:5px}
.jours i{aspect-ratio:1;border-radius:5px;background:var(--track);max-width:100%}
.jours i.n1{background:color-mix(in oklab,var(--ok) 35%,var(--track))}
.jours i.n2{background:color-mix(in oklab,var(--ok) 65%,var(--track))}
.jours i.n3{background:var(--ok)}
.jours i.auj{outline:2px solid var(--ink);outline-offset:1px}
.comp{display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 10px;padding:10px 0;border-top:1px solid var(--line);text-decoration:none}
.comp:first-of-type{border-top:none}
.comp .id{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--muted);padding-top:2px}
.comp .nm{font-size:14px;font-weight:600}
.niv{grid-column:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.niv div{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted)}
.niv .barre{flex:none;height:6px}
.niv .barre>i{background:var(--ok)}
.sync{font-size:12px;color:var(--muted);text-align:center}
.legende{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (min-width:560px){.parties{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>

</div></nav>

<script>
(function(){
'use strict';
var INTERVALLES=[1,1,3,7,16,35];   // jours avant de revoir une carte, par boîte (0 = ratée)
var SEUIL=7/12;                      // part de bonnes réponses : en dessous, le cours est « à revoir »
var MAITRISE=10/12;
var CLE='cours-rh-gh-progres';
var NIV=['','N1 · découvrir','N2 · pratiquer','N3 · maîtriser'];
var ETATS={afaire:'À faire',encours:'En cours',fini:'Terminé',revoir:'À revoir'};
var $app=document.getElementById('app');
var CAT=null, PAR={}, CH={}, CO={}, COMP={}, ORDRE=[];
var P=vide();
var ui={groupe:'partie',statut:'tous',q:'',partie:0,zoom:0};
var sess=null; // séance de QCM ou de révision en cours

function vide(){return {v:2,cours:{},cartes:{},jours:{},dernier:null}}
// v1 → v2 : les cours passent de 7 à 6 pages (QCM et corrigé retirés) ; l'ancienne page 7 devient la 6
function migrer(x){x=JSON.parse(JSON.stringify(x||{}));if((x.v|0)>=2)return x;for(var n in (x.cours||{})){var c=x.cours[n],b=c.pg|0;c.pg=(b&31)|(((b>>6)&1)<<5)}if(x.dernier&&x.dernier.pg>6)x.dernier.pg=6;x.v=2;return x}
function nbPages(n){return CO[n].pg.length}
function totQ(pr){return pr.tot||12}
function ratio(pr){return (pr.best||0)/totQ(pr)}
function nettoyer(){for(var k in P.cartes){var p=k.split('-');if(!CO[+p[0]]||!CO[+p[0]].qk[+p[1]])delete P.cartes[k]}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function jour(d){d=d||new Date();var m=d.getMonth()+1,j=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(j<10?'0':'')+j}
function plus(n){var d=new Date();d.setDate(d.getDate()+n);return jour(d)}
function pc(p){return '--pc:'+PAR[p].c}
function num(c){return c.num}
function pagesLues(n){var c=P.cours[n];if(!c||!c.pg)return 0;var k=0,b=c.pg;while(b){k+=b&1;b>>=1}return k}

/* ---------- état d'un cours ---------- */
function statut(n){var c=P.cours[n];if(!c)return 'afaire';if(c.nb>0)return ratio(c)>=SEUIL-1e-9?'fini':'revoir';if(c.pg)return 'encours';return 'afaire'}
function etatHtml(n){var s=statut(n);return '<span class="etat '+s+'">'+ETATS[s]+'</span>'}
function cartesDues(){var t=jour(),r=[];for(var k in P.cartes){if(P.cartes[k].d<=t)r.push(k)}return r}
function noter(){P.jours[jour()]=(P.jours[jour()]||0)+1}

/* ---------- sauvegarde : appareil + base partagée ---------- */
var doc=null, enAttente=false, minuteur=null, syncEtat='local';
function lireLocal(){try{var s=localStorage.getItem(CLE);if(s)return JSON.parse(s)}catch(e){}return null}
function ecrireLocal(){try{localStorage.setItem(CLE,JSON.stringify(P))}catch(e){}}
function fusion(a,b){ // réunit deux états sans rien perdre
  var r=vide(),k;
  r.cours=JSON.parse(JSON.stringify(a.cours||{}));

  var boites=[0,0,0,0,0,0];for(var k in P.cartes)boites[P.cartes[k].b]++;
  var demain=0,t=plus(1);for(k in P.cartes)if(P.cartes[k].d===t)demain++;
  var h='<div class="ecran"><div><h1>Révisions</h1><p class="sous">Chaque question revient juste avant que tu l’oublies : le lendemain si tu l’as ratée, puis après 3, 7, 16 et 35 jours.</p></div>';
  h+='<div class="carte"><div class="ligne ecarte"><div><span class="grand">'+dues.length+'</span><br><span style="color:var(--muted);font-size:14px">question'+(dues.length>1?'s':'')+' à revoir aujourd’hui</span></div>'+(dues.length?'<a class="btn plein" href="#revision">Commencer</a>':'')+'</div>'+
    (dues.length>15?'<p style="margin:0;font-size:13px;color:var(--muted)">Une séance en prend 15, les plus anciennes d’abord.</p>':'')+
    (!dues.length?'<p style="margin:0;font-size:14px;color:var(--muted)">'+(total?'Demain : '+demain+' question'+(demain>1?'s':'')+'.':'Fais le QCM d’un cours : ses questions entrent ici.')+'</p>':'')+'</div>';
  if(total){
    h+='<div class="carte"><h2>Tes '+total+' questions en mémoire</h2><div style="display:flex;flex-direction:column;gap:8px">'+
      ['Ratées, demain','Boîte 1 · 1 jour','Boîte 2 · 3 jours','Boîte 3 · 7 jours','Boîte 4 · 16 jours','Boîte 5 · 35 jours'].map(function(l,b){return '<div class="ligne"><span style="width:130px;font-size:13px;flex:none">'+l+'</span><div class="barre"><i style="width:'+Math.round(boites[b]/total*100)+'%;background:'+(b===0?'var(--ko)':'var(--ok)')+'"></i></div><span class="mono" style="font-size:12px;width:34px;text-align:right">'+boites[b]+'</span></div>'}).join('')+'</div></div>';
  }
  // par cours, ce qui est dû
  var parCours={};dues.forEach(function(k){var n=+k.split('-')[0];parCours[n]=(parCours[n]||0)+1});
  var ks=Object.keys(parCours);
  if(ks.length){h+='<div class="carte"><h2>D’où viennent les questions du jour</h2><div>'+ks.map(function(n){return ligneCours(CO[n])}).join('')+'</div></div>'}
  h+='</div>';$app.innerHTML=h;
}
function vueSeance(){
  if(!sess||sess.type!=='rev'){
    var dues=cartesDues().sort(function(a,b){return P.cartes[a].d<P.cartes[b].d?-1:P.cartes[a].d>P.cartes[b].d?1:Math.random()-.5}).slice(0,15);
    for(var i=dues.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=dues[i];dues[i]=dues[j];dues[j]=t}
    if(!dues.length){aller('revisions');return}
    sess={type:'rev',items:dues.map(function(k){var p=k.split('-');return {n:+p[0],i:+p[1]}}),k:0,choix:[],valide:false,res:[]};
  }
  dessinerQuestion();
}
function dessinerQuestion(){
  var s=sess;if(s.k>=s.items.length)return finSeance();
  var it=s.items[s.k],c=CO[it.n],q=c.qk[it.i],multi=q.m;
  // ordre des réponses tiré au hasard une fois par question : la bonne réponse n'est plus toujours au même endroit
  if(!it.perm){it.perm=q.o.map(function(_,i){return i});for(var z=it.perm.length-1;z>0;z--){var y=Math.floor(Math.random()*(z+1)),w=it.perm[z];it.perm[z]=it.perm[y];it.perm[y]=w}}
  var lettre=function(i){return 'ABCD'[it.perm.indexOf(i)]};
  var h='<div class="pc" style="'+pc(c.p)+'"><div class="ecran">';
  h+='<div class="q-tete"><a class="btn petit" href="'+(s.type==='qcm'?'#cours-'+c.n:'#revisions')+'">‹ Quitter</a><span>'+(s.type==='qcm'?'QCM · cours '+esc(c.num):'Révision')+' · <b style="color:var(--ink)">'+(s.k+1)+' / '+s.items.length+'</b></span></div>';
  h+='<div class="progression-q"><i style="width:'+Math.round(s.k/s.items.length*100)+'%"></i></div>';
  if(s.type==='rev')h+='<a href="#cours-'+c.n+'" class="mono" style="font-size:12.5px;color:var(--pt);text-decoration:none">Cours '+esc(c.num)+' · '+esc(c.t)+'</a>';
  h+='<div>'+(multi?'<span class="q-tag">Plusieurs réponses</span>':'')+'<p class="q-enonce">'+esc(q.e)+'</p></div>';
  h+='<div class="options" role="group">'+it.perm.map(function(i){var o=q.o[i];
    var cls='opt'+(multi?' multi':''),verdict='';
    var ch=s.choix.indexOf(i)>=0,bon=q.r.indexOf(i)>=0;
    if(s.valide){if(bon){cls+=' juste';verdict=ch?'Bonne réponse':'Il fallait la cocher'}else if(ch){cls+=' faux';verdict='Fausse'}}
    else if(ch)cls+=' choisi';
    return '<button class="'+cls+'" data-i="'+i+'" aria-pressed="'+ch+'"'+(s.valide?' disabled':'')+'><span class="l">'+lettre(i)+'</span><span>'+esc(o)+'</span>'+(verdict?'<span class="verdict">'+verdict+'</span>':'')+'</button>'}).join('')+'</div>';
  if(s.valide){var ok=s.res[s.k];
    h+='<div class="retour '+(ok?'bon':'mauvais')+'"><b>'+(ok?'Juste.':'Pas tout à fait. Réponse : '+q.r.map(lettre).sort().join(' et ')+'.')+'</b>'+esc(q.x)+'</div>';
    h+='<button class="btn plein" id="suite">'+(s.k+1<s.items.length?'Question suivante':'Voir le résultat')+'</button>';
  } else h+='<button class="btn plein" id="valider"'+(s.choix.length?'':' disabled')+'>Valider</button>';
  h+='</div></div>';
  $app.innerHTML=h;
  $app.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){var i=+b.dataset.i;
    if(multi){var p=s.choix.indexOf(i);if(p>=0)s.choix.splice(p,1);else s.choix.push(i)}else s.choix=[i];dessinerQuestion()}});
  var v=document.getElementById('valider');if(v)v.onclick=function(){
    var ok=s.choix.length===q.r.length&&q.r.every(function(i){return s.choix.indexOf(i)>=0});
    s.res[s.k]=ok;s.valide=true;carte(it.n,it.i,ok);noter();sauver();dessinerQuestion()};
  var u=document.getElementById('suite');if(u){u.onclick=function(){s.k++;s.choix=[];s.valide=false;dessinerQuestion();window.scrollTo(0,0)};u.focus({preventScroll:true})}
}
function carte(n,i,ok){var k=n+'-'+i,c=P.cartes[k]||{b:0},b=ok?Math.min(5,(P.cartes[k]?c.b:0)+1):0;
  P.cartes[k]={b:b,d:plus(INTERVALLES[b]),t:Date.now()}}
function finSeance(){
  var s=sess,ok=s.res.filter(Boolean).length,tot=s.items.length,h='<div class="ecran">';
  if(s.type==='qcm'){
    var c=CO[s.n],pr=P.cours[s.n]||(P.cours[s.n]={pg:0,best:0,last:0,nb:0,at:''});
    if(!s.enregistre){if(pr.nb&&totQ(pr)!==tot)pr.best=Math.min(tot,Math.round(pr.best*tot/totQ(pr)));pr.tot=tot;pr.last=ok;pr.best=Math.max(pr.best||0,ok);pr.nb=(pr.nb||0)+1;pr.at=jour();P.dernier={n:s.n,pg:nbPages(s.n),t:Date.now()};s.enregistre=true;sauver()}
    var mm=Math.ceil(tot*MAITRISE-1e-9),ma=Math.ceil(tot*SEUIL-1e-9);
    var msg=ok>=mm?'Maîtrisé. Les questions reviendront espacées pour le rester.':ok>=ma?'Acquis. Les questions ratées reviennent demain en révision.':'À revoir. Relis les pages concernées, puis refais le QCM.';
    h+='<div class="pc" style="'+pc(c.p)+'"><a class="mono" href="#cours-'+c.n+'" style="font-size:13px;color:var(--pt);text-decoration:none">Cours '+esc(c.num)+' · '+esc(c.t)+'</a></div>';
    h+='<div class="carte" style="align-items:flex-start"><div class="score">'+ok+'<small> / '+tot+'</small></div><p style="margin:0;font-size:16px;font-weight:600">'+msg+'</p><p style="margin:0;font-size:13px;color:var(--muted)">Barème : '+mm+' à '+tot+' maîtrisé · '+ma+' à '+(mm-1)+' acquis · moins de '+ma+' à revoir. Meilleur score : '+pr.best+' / '+tot+'.</p>'+
      '<div class="recap-q">'+s.res.map(function(r,i){return '<span class="'+(r?'o':'x')+'" title="Question '+(i+1)+'">'+(i+1)+'</span>'}).join('')+'</div></div>';
    var nx=suivantDansParcours(s.n);
    h+='<div class="ligne">'+(ok<ma?'<a class="btn plein" style="flex:1" href="#lire-'+c.n+'-1">Relire le cours</a>':(nx?'<a class="btn plein" style="flex:1" href="#cours-'+nx+'">Cours suivant · '+esc(CO[nx].num)+'</a>':''))+'<a class="btn" style="flex:1" href="#cours-'+c.n+'">Retour à la fiche</a></div>';
  } else {
    h+='<div><h1>Séance terminée</h1><p class="sous">'+ok+' juste'+(ok>1?'s':'')+' sur '+tot+'. Les réponses justes montent d’une boîte, les ratées reviennent demain.</p></div>';
    h+='<div class="carte"><div class="recap-q">'+s.res.map(function(r,i){return '<span class="'+(r?'o':'x')+'">'+(i+1)+'</span>'}).join('')+'</div></div>';
    var reste=cartesDues().length;
    h+='<div class="ligne">'+(reste?'<button class="btn plein" style="flex:1" id="encore">Encore '+Math.min(15,reste)+'</button>':'')+'<a class="btn" style="flex:1" href="#accueil">Accueil</a></div>';
  }
  h+='</div>';$app.innerHTML=h;
  var e=document.getElementById('encore');if(e)e.onclick=function(){sess=null;vueSeance()};
}

/* ---------- Progrès ---------- */
function vueProgres(){
  var fini=compte(ORDRE),questions=0,serie=0,memo=0,k;
  for(k in P.cartes){if(P.cartes[k].b>=3)memo++}
  var d=new Date();if(!P.jours[jour(d)])d.setDate(d.getDate()-1);
  while(P.jours[jour(d)]){serie++;d.setDate(d.getDate()-1)}
  var repondues=Object.keys(P.cartes).length;
  var h='<div class="ecran"><div><h1>Progrès</h1><p class="sous">Où tu en es, compétence par compétence.</p></div>';
  h+='<div class="kpis"><div class="kpi"><b>'+fini+'<small style="font-size:14px;color:var(--muted);font-weight:500"> / '+ORDRE.length+'</small></b><span>cours terminés</span></div>'+
    '<div class="kpi"><b>'+serie+'</b><span>jour'+(serie>1?'s':'')+' de suite</span></div>'+
    '<div class="kpi"><b>'+repondues+'</b><span>questions vues sur '+ORDRE.reduce(function(a,n){return a+CO[n].q.length},0)+'</span></div>'+
    '<div class="kpi"><b>'+memo+'</b><span>bien ancrées (7 j et plus)</span></div></div>';
  // activité 28 jours, lundi en tête
  var cases=[],auj=new Date(),deb=new Date();deb.setDate(auj.getDate()-27);
  var dec=(deb.getDay()+6)%7;deb.setDate(deb.getDate()-dec);
  var x=new Date(deb);while(x<=auj){var j=jour(x),v=P.jours[j]||0;cases.push('<i class="'+(v>=20?'n3':v>=8?'n2':v>0?'n1':'')+(j===jour(auj)?' auj':'')+'" title="'+j+' · '+v+'"></i>');x.setDate(x.getDate()+1)}
  h+='<div class="carte"><h2>Activité · 4 dernières semaines</h2><div class="jours" style="font-size:11px;color:var(--muted);text-align:center">'+['L','M','M','J','V','S','D'].map(function(l){return '<span>'+l+'</span>'}).join('')+'</div><div class="jours">'+cases.join('')+'</div><div class="legende"><span>Une case par jour, plus foncée quand tu as lu ou répondu davantage.</span></div></div>';
  // compétences
  h+='<div class="carte"><h2>Compétences · part des cours terminés par niveau</h2><div>';
  CAT.comps.forEach(function(k){var parN=[[],[],[],[]];ORDRE.forEach(function(n){if(CO[n].comp===k.id)parN[CO[n].niv].push(n)});
    h+='<a class="comp" href="#biblio" data-comp="'+k.id+'"><span class="id">'+k.id+'</span><span class="nm">'+esc(k.nom)+'</span><div class="niv">'+[1,2,3].map(function(v){var l=parN[v];if(!l.length)return '<div><span>N'+v+' · aucun cours</span><div class="barre"></div></div>';var f=compte(l);return '<div><span>N'+v+' · '+f+'/'+l.length+'</span><div class="barre"><i style="width:'+Math.round(f/l.length*100)+'%"></i></div></div>'}).join('')+'</div></a>'});
  h+='</div></div>';
  var rev=ORDRE.filter(function(n){return statut(n)==='revoir'});
  h+='<div class="carte"><h2>À revoir · moins de 7 bonnes réponses sur 12</h2>'+(rev.length?'<div>'+rev.map(function(n){return ligneCours(CO[n])}).join('')+'</div>':'<p style="margin:0;color:var(--muted);font-size:14px">Aucun cours sous le seuil.</p>')+'</div>';
  h+='<div class="carte"><h2>Sauvegarde</h2><p style="margin:0;font-size:14px;color:var(--muted)">Ta progression vit sur ce téléphone. Exporte-la de temps en temps : le fichier permet de la retrouver après un changement de téléphone.</p><div class="ligne"><button class="btn" style="flex:1" id="exporter">Exporter</button><label class="btn" style="flex:1">Importer<input type="file" id="importer" accept=".json,application/json" hidden></label></div><p id="msg-sauve" style="margin:0;font-size:13px" hidden></p></div>';
  h+='<p class="sync" id="sync">'+syncTexte()+'</p></div>';
  $app.innerHTML=h;
  document.getElementById('exporter').onclick=function(){var b=new Blob([JSON.stringify(P)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='progression-cours-rh-gh-'+jour()+'.json';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000)};
  document.getElementById('importer').onchange=function(){var f=this.files[0],m=document.getElementById('msg-sauve');if(!f)return;f.text().then(function(t){var d=JSON.parse(t);if(!d||!d.cours||!d.cartes)throw 0;P=fusion(P,d);sauver();vueProgres();var m2=document.getElementById('msg-sauve');m2.hidden=false;m2.textContent='Progression importée et fusionnée.'}).catch(function(){m.hidden=false;m.style.color='var(--ko)';m.textContent='Ce fichier n’est pas une sauvegarde de progression.'})};
  $app.querySelectorAll('[data-comp]').forEach(function(a){a.onclick=function(){ui.groupe='comp';ui.partie=0;ui.statut='tous';ui.q=''}});
}

/* ---------- démarrage ---------- */
var local=lireLocal();if(local&&local.cours)P=fusion(vide(),migrer(local));
fetch('catalogue.json').then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){
  CAT=d;
  d.parties.forEach(function(p){PAR[p.p]=p;p.chs.forEach(function(ch){CH[ch.id]=ch;ORDRE=ORDRE.concat(ch.cours)})});
  d.cours.forEach(function(c){CO[c.n]=c;c.qk={};c.q.forEach(function(q){c.qk[q.k]=q})});
  ORDRE=ORDRE.filter(function(n){return CO[n]});
  d.comps.forEach(function(k){COMP[k.id]=k.nom});
  nettoyer();ecrireLocal();
  derniereVue=location.hash;rendre();
},function(){$app.innerHTML='<div class="ecran"><p class="vide">Le catalogue n’a pas pu être chargé. Recharge la page.</p></div>'});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>

</body></html>
